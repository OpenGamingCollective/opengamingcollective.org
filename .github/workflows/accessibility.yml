name: Accessibility

on:
  pull_request:
    branches:
      - main
      - next
    paths:
      - ".github/workflows/accessibility.yml"
      - "astro.config.*"
      - "package.json"
      - "playwright.config.*"
      - "pnpm-lock.yaml"
      - "public/**"
      - "src/**"
      - "tests/**"
      - "tsconfig.json"
  push:
    branches:
      - main
      - next
    paths:
      - ".github/workflows/accessibility.yml"
      - "astro.config.*"
      - "package.json"
      - "playwright.config.*"
      - "pnpm-lock.yaml"
      - "public/**"
      - "src/**"
      - "tests/**"
      - "tsconfig.json"
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_COLOR: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set Up PNPM
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set Up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Accessibility Audit
        run: pnpm test
