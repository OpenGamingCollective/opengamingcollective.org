name: Accessibility

on:
  pull_request:
    branches:
      - main
      - next
    paths:
      - ".github/workflows/accessibility.yml"
      - "astro.config.*"
      - "package.json"
      - "playwright.config.*"
      - "pnpm-lock.yaml"
      - "public/**"
      - "src/**"
      - "tests/**"
      - "tsconfig.json"
  push:
    branches:
      - main
      - next
    paths:
      - ".github/workflows/accessibility.yml"
      - "astro.config.*"
      - "package.json"
      - "playwright.config.*"
      - "pnpm-lock.yaml"
      - "public/**"
      - "src/**"
      - "tests/**"
      - "tsconfig.json"
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_COLOR: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set Up PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set Up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Accessibility Audit
        run: pnpm test:ci
