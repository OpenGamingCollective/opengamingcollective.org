name: Accessibility

on:
  pull_request:
    branches:
      - main
      - next
    paths:
      - ".github/workflows/accessibility.yml"
      - "astro.config.*"
      - "package.json"
      - "playwright.config.*"
      - "pnpm-lock.yaml"
      - "public/**"
      - "src/**"
      - "tests/**"
      - "tsconfig.json"
  push:
    branches:
      - main
      - next
    paths:
      - ".github/workflows/accessibility.yml"
      - "astro.config.*"
      - "package.json"
      - "playwright.config.*"
      - "pnpm-lock.yaml"
      - "public/**"
      - "src/**"
      - "tests/**"
      - "tsconfig.json"
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_COLOR: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set Up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Accessibility Audit
        run: pnpm test:ci
